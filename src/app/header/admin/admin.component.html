
<div class="admin-container">
    <div class="admin-add-user">
        <input type="text" placeholder="User name" [(ngModel)]="name">
        <select name="gender" [(ngModel)]="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <br>
        <select name="subcriptionType" [(ngModel)]="subType">
            <option value="Monthly">Monthly</option>
            <option value="Quarterly">Quarterly</option>
            <option value="Yearly">Yearly</option>
        </select>
        <select name="status" [(ngModel)]="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>
        <br>
        <button class="admin-button" (click)="CreateNewUser()">CREATE</button>
    </div>
    <app-user-list></app-user-list>
    <app-user-details></app-user-details>
</div>
